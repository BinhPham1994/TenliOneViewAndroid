plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id("org.jetbrains.kotlin.plugin.compose")
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    id 'kotlin-kapt'
    id("com.google.devtools.ksp")
}

configurations.configureEach {
    exclude group: 'androidx.databinding', module: 'baseLibrary'
}

android {
    namespace 'com.tenli.oneview'
    compileSdk 36

    defaultConfig {
        applicationId "com.tenli.oneview"
        minSdk 26
        targetSdk 35
        versionCode 100
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        manifestPlaceholders = [appName: "AI OneView",
                                appIcon: "@drawable/logo_app"]
        buildConfigField "String", "DOMAIN_CLOUD", "\"https://app.tenli.ai/api/v1/\""
        buildConfigField "String", "CLIENT_ID", "\"ysJhBedR7PDrVRpE\""
        buildConfigField "String", "CLIENT_SECRET", "\"v9TaVZo2ZrdjtSwHCWvXM6Nt31m3bEef\""
        buildConfigField "String", "WEB_CLIENT_ID", "\"139855279628-ec70h3thpk1u9p49u76bf9st2p26ghgb.apps.googleusercontent.com\""
    }

    packaging {
        resources {
            excludes += '/META-INF/versions/9/OSGI-INF/MANIFEST.MF'
            excludes += 'META-INF/DEPENDENCIES'
            excludes += 'META-INF/LICENSE'
            excludes += 'META-INF/NOTICE'
            excludes += 'META-INF/osgi.bundle'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        dataBinding true
        viewBinding true
        buildConfig true
    }

    bundle {
        language { enableSplit = false }
    }
}

dependencies {
    def compose_version = "1.10.5"
    implementation "androidx.compose.ui:ui:$compose_version"
    implementation "androidx.compose.ui:ui-tooling-preview:$compose_version"
    implementation "androidx.compose.ui:ui-text:$compose_version"
    implementation "androidx.compose.foundation:foundation:$compose_version"
    implementation "androidx.compose.foundation:foundation-layout:$compose_version"
    implementation "androidx.compose.animation:animation:$compose_version"
    implementation "androidx.compose.runtime:runtime:$compose_version"

    implementation "androidx.compose.material3:material3:1.4.0"
    implementation "androidx.compose.material:material-icons-core"
    implementation "androidx.compose.material:material-icons-extended:1.7.8"

    // 2. Firebase (Dùng BOM để tự quản lý version nội bộ)
    implementation platform('com.google.firebase:firebase-bom:34.11.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-analytics'

    // 3. UI Components & System
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.core:core-splashscreen:1.2.0'

    // 4. Architecture Components (Lifecycle, Navigation, Hilt)
    def lifecycle_version = "2.10.0"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:$lifecycle_version"
    implementation "androidx.navigation:navigation-compose:2.9.7"
    implementation "androidx.hilt:hilt-navigation-compose:1.3.0"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'

    // 5. Network & API
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:5.3.2'

    // 7. Google Services & Updates
    implementation 'com.google.android.gms:play-services-auth:21.5.1'
    implementation 'com.google.android.play:app-update-ktx:2.1.0'

    // 8. Media & Image Processing
    implementation 'androidx.media3:media3-exoplayer:1.10.0'
    implementation 'androidx.media3:media3-ui:1.10.0'
    implementation 'androidx.media3:media3-common:1.10.0'
    implementation "io.coil-kt:coil-compose:2.7.0"

    // 9. Utils & Workers
    implementation 'androidx.work:work-runtime-ktx:2.11.2'

    // 11. Testing & Debug
    debugImplementation "androidx.compose.ui:ui-tooling:$compose_version"
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}